services:
  - type: web
    name: smotritel-artgallery
    runtime: node
    plan: standard
    autoDeployTrigger: 'off'
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.cjs
    healthCheckPath: /health
    disk:
      name: gallery-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: '22.x'
      - key: GALLERY_DATA_DIR
        value: /var/data
      - key: GALLERY_ADMIN_PASSWORD
        sync: false
